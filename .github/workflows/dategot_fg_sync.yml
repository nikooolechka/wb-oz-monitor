name: "Синхрон F/G (даты готовности -> остатки), ежечасно 07-21 МСК"

on:
  schedule:
    - cron: "0 4-18 * * *"   # ежечасно 07:00-21:00 МСК — синхрон F/G (идемпотентно)
    # (дублёр: Яндекс-функция ostatki-trigger сдохла после пожара ЦОД — крон восстановлен 12.10)
  workflow_dispatch:

concurrency:
  group: dategot_fg
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests
      - name: Прогон
        env:
          GSHEETS_SA_JSON: ${{ secrets.GSHEETS_SA_JSON }}
        run: python dategot_fg_sync.py
