name: Остатки 1С (почта → таблица → скрин, будни 12:10 МСК)

on:
  schedule:
    - cron: "*/20 9-12 * * 1-5"   # каждые 20 мин 12:00-15:59 МСК будни — ловим письмо 1С (persist, дедуп удалением).
    #   Было "0 9-15" (раз/час в :00) — GitHub ронял одиночный :00-тик → 13.10 автомат не запустился ни разу в окне.
    #   Частые тики перекрывают дроп. Идемпотентно (concurrency:ostatki + письмо уходит в Корзину после поста).
    # (Яндекс-таймер ostatki-trigger мёртв после пожара ЦОД — durable-фикс: возродить его; крон — стоп-гэп.)
  workflow_dispatch:
    inputs:
      nodelete:
        description: "NODELETE=1 — не удалять письмо (для теста)"
        required: false
        default: ""
      demand_data:
        description: "JSON съёма 1С для on-demand (если задан — берём его вместо письма)"
        required: false
        default: ""

concurrency:
  group: ostatki
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests PyMuPDF Pillow
      - name: Прогон
        env:
          MAILRU_APP_PASS: ${{ secrets.MAILRU_APP_PASS }}
          GSHEETS_SA_JSON: ${{ secrets.GSHEETS_SA_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OSTATKI_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NODELETE: ${{ github.event.inputs.nodelete }}
          DEMAND_DATA: ${{ github.event.inputs.demand_data }}
        run: python ostatki_monitor.py
