name: Сторож свежести архива отзывов Ozon

on:
  schedule:
    - cron: "30 6 * * *"     # ежедневно 06:30 UTC / 09:30 МСК
  workflow_dispatch:          # ручной запуск (вход DRY через env для теста)

permissions:
  contents: write             # чтобы коммитить снимок состояния обратно

concurrency:
  group: oz-reviews-watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Прогон сторожа свежести архива Ozon
        env:
          GSHEETS_SA_JSON: ${{ secrets.GSHEETS_SA_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python oz_reviews_watchdog.py
      - name: Сохранить снимок обратно в репозиторий
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/oz_reviews_watchdog_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "oz reviews watchdog state [skip ci]"
            git push
          else
            echo "Снимок не изменился — коммит не нужен."
          fi
