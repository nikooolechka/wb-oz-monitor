name: Монитор удержаний и штрафов (Ozon + WB → канал)

on:
  schedule:
    - cron: "0 7 * * *"   # ежедневно ~10:00 МСК; шлёт ровно раз в неделю (вт+, дедуп по неделе) — страховка от пропусков GitHub-крона
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = только лог, без отправки и без записи state"
        default: ""
      force:
        description: "1 = игнорировать дедуп недели (отправить вручную)"
        default: ""

permissions:
  contents: write

concurrency:
  group: uderzhaniya
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Прогон монитора удержаний
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          WB_FIN_TOKEN: ${{ secrets.WB_FIN_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_PATH: data/uderzhaniya_state.json
          DRY: ${{ github.event.inputs.dry }}
          FORCE: ${{ github.event.inputs.force }}
        run: python uderzhaniya_monitor.py
      - name: Сохранить состояние обратно
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/uderzhaniya_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "uderzhaniya state update [skip ci]"
            git push
          else
            echo "Состояние не изменилось."
          fi
