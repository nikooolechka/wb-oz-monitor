name: RDP reach test (одноразовый)
on:
  workflow_dispatch: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: knock + check RDP
        run: |
          IP=178.236.29.127
          echo "runner egress IP:"; curl -s https://api.ipify.org; echo
          echo "=== стук 210/35/100 ==="
          ping -c1 -s 210 $IP || true
          ping -c1 -s 35 $IP || true
          ping -c1 -s 100 $IP || true
          sleep 2
          echo "=== порты после стука ==="
          for p in 3389 3380 22; do
            timeout 8 bash -c "echo > /dev/tcp/$IP/$p" 2>/dev/null && echo "port $p OPEN" || echo "port $p closed/timeout"
          done
