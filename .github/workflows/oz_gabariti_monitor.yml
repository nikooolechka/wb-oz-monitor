name: Монитор габаритов Ozon (карточки → канал изменений)

on:
  schedule:
    - cron: "0 9 * * *"   # ежедневно, 12:00 МСК
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oz-gabariti
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Прогон монитора габаритов Ozon
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_PATH: data/oz_gabariti_state.json
        run: python oz_gabariti_monitor.py
      - name: Сохранить снимок обратно
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/oz_gabariti_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "oz gabariti state update [skip ci]"
            git push
          else
            echo "Снимок не изменился — коммит не нужен."
          fi
