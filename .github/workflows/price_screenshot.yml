name: Скрин цен в чат отдела (10:30 и 17:30, только если свежие)

on:
  schedule:
    - cron: "*/15 6-8 * * *"
    - cron: "*/15 13-15 * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = проверить свежесть и собрать скрины, но НЕ отправлять"
        default: ""
      force:
        description: "1 = дослать СЕЙЧАС мимо окна времени и дедупа (разовый catch-up)"
        default: ""

permissions:
  contents: write

concurrency:
  group: price-screenshot
  cancel-in-progress: false

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Свежие цены (Huckster) + ВБ до-СПП перед скрином (WB — 1 раз на окно)
        continue-on-error: true
        env:
          HUCKSTER_USER: ${{ secrets.HUCKSTER_USER }}
          HUCKSTER_PASS: ${{ secrets.HUCKSTER_PASS }}
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          YM_KEY: ${{ secrets.YM_KEY }}
          GSHEETS_SA_JSON: ${{ secrets.GSHEETS_SA_JSON }}
        run: pip install google-auth requests && python boevaya_write.py
      - name: Скрин цен → чат отдела (если свежие)
        env:
          PRICES_SHEET_ID: ${{ secrets.PRICES_SHEET_ID }}
          GSHEETS_SA_JSON: ${{ secrets.GSHEETS_SA_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PRICES_SCREENSHOT_CHAT_ID: ${{ secrets.PRICES_SCREENSHOT_CHAT_ID }}
          DRY: ${{ github.event.inputs.dry }}
          FORCE: ${{ github.event.inputs.force }}
        run: python price_screenshot.py
      - name: Сохранить дедуп-состояние
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/price_screenshot_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "price screenshot state [skip ci]"; git push
          else
            echo "state не изменился"
          fi
