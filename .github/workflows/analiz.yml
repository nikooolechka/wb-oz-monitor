name: analiz_process
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"
concurrency:
  group: analiz_process
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q -r requirements.txt
      - name: Process queue
        env:
          GSHEETS_SA_JSON: ${{ secrets.GSHEETS_SA_JSON }}
          ANALIZ_BOT_TOKEN: ${{ secrets.ANALIZ_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          WORDSTAT_API_KEY: ${{ secrets.WORDSTAT_API_KEY }}
          WORDSTAT_FOLDER: ${{ secrets.WORDSTAT_FOLDER }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          MPSTATS_TOKEN: ${{ secrets.MPSTATS_TOKEN }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          CF_AI_ACCOUNT: ${{ secrets.CF_AI_ACCOUNT }}
        run: python analiz_process.py
