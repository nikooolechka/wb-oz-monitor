name: "Месячный B1 + потребность (даты готовности)"

on:
  schedule:
    - cron: "0 0-6 21-25 * *"   # 03:00-09:00 МСК 21-25 числа — потребность на след. месяц (гейт от повторов)
    # (дублёр: Яндекс-функция ostatki-trigger сдохла после пожара ЦОД — крон восстановлен 12.10)
  workflow_dispatch:

concurrency:
  group: monthly_dategot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests
      - name: Прогон
        env:
          GSHEETS_SA_JSON: ${{ secrets.GSHEETS_SA_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monthly_dategot.py
