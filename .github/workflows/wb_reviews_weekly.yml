name: Отзывы WB — ежедневный сбор в архив + сводка по понедельникам

on:
  schedule:
    # ЕЖЕДНЕВНО собираем в архив (скрипт сам шлёт сводку ТОЛЬКО по понедельникам).
    # GitHub-крон ненадёжен (дрейфит в ночь) — ПЕРВИЧНО дёргает Яндекс-таймер
    # reviews-daily-msk (10:00 МСК). Здесь — только дублёры. Дедуп (1 сводка/неделя).
    - cron: "0 7 * * *"      # 10:00 МСК ежедневно
    - cron: "0 9 * * 1"      # 12:00 МСК пн (резерв)
    - cron: "0 11 * * 1"     # 14:00 МСК пн (резерв)
  workflow_dispatch:
    inputs:
      dry:
        description: "DRY — посчитать и показать в логе, но НЕ слать в канал"
        type: boolean
        default: false
      mode:
        description: "report (дефолт) | archive (только сбор)"
        type: string
        default: "report"
      snap:
        description: "SNAP — форсировать снимок рейтинга WB (иначе только по понедельникам)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wb_reviews_weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Сбор отзывов WB в архив (+ сводка по понедельникам)
        env:
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          GSHEETS_SA_JSON: ${{ secrets.GSHEETS_SA_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY: ${{ inputs.dry && '1' || '' }}
          MODE: ${{ inputs.mode || 'report' }}
          SNAP: ${{ inputs.snap && '1' || '' }}
        run: python wb_reviews_weekly.py
      - name: Сохранить состояние (какая неделя уже отправлена)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reviews_weekly_state.json || true
          git commit -m "reviews weekly state [skip ci]" || echo "нечего коммитить"
          git push || echo "нечего пушить"
