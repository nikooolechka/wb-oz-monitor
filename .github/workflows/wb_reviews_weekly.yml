name: Еженедельная сводка отзывов WB (пн 15:00 МСК → канал)

on:
  schedule:
    # понедельник, несколько времён — если один крон GitHub дропнется, поймает следующий.
    # Дедуп в скрипте (одна сводка на неделю) не даст задвоить.
    - cron: "0 12 * * 1"     # 15:00 МСК
    - cron: "0 14 * * 1"     # 17:00 МСК (резерв)
    - cron: "0 16 * * 1"     # 19:00 МСК (резерв)
  workflow_dispatch:
    inputs:
      dry:
        description: "DRY — посчитать и показать в логе, но НЕ слать в канал"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: wb_reviews_weekly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Сводка отзывов WB за неделю
        env:
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          GSHEETS_SA_JSON: ${{ secrets.GSHEETS_SA_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY: ${{ inputs.dry && '1' || '' }}
        run: python wb_reviews_weekly.py
      - name: Сохранить состояние (какая неделя уже отправлена)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/reviews_weekly_state.json || true
          git commit -m "reviews weekly state [skip ci]" || echo "нечего коммитить"
          git push || echo "нечего пушить"
