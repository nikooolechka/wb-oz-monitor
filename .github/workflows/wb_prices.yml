name: Витринные цены WB

on:
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = только лог, без записи"
        default: ""
  schedule:
    - cron: "0 7 * * *"    # 10:00 МСК — ранняя фаза (снимок теперь пишет ПК)
    - cron: "30 14 * * *"  # 17:30 МСК — финальная фаза: новый столбец в «история» (после прогона ПК 17:00)

permissions:
  contents: read

concurrency:
  group: wb-prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Прокси (Happ failover) + сбор цен WB/Ozon
        env:
          OZ_PROXY: "socks5://127.0.0.1:10808"
          HAPP_SUB_URL: ${{ secrets.HAPP_SUB_URL }}
          HAPP_HWID: ${{ secrets.HAPP_HWID }}
          MPSTATS_TOKEN: ${{ secrets.MPSTATS_TOKEN }}
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          GSHEETS_SA_JSON: ${{ secrets.GSHEETS_SA_JSON }}
          PRICES_SHEET_ID: ${{ secrets.PRICES_SHEET_ID }}
          PRICES_HIST_ENABLED: ${{ secrets.PRICES_HIST_ENABLED }}
          PRICES_OZ_ENABLED: ${{ secrets.PRICES_OZ_ENABLED }}
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY: ${{ github.event.inputs.dry }}
        run: |
          curl -sL -o xray.zip "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
          unzip -o -q xray.zip xray && chmod +x xray || echo "xray скачать не удалось (Ozon composer пропустится)"
          python3 setup_oz_proxy.py || echo "Ozon-прокси не поднялся — Ozon пропустится, WB не пострадает"
          python wb_prices.py
