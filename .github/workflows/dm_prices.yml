name: Витринные цены Детский Мир
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"    # 10:00 МСК
    - cron: "0 14 * * *"   # 17:00 МСК
permissions:
  contents: read
concurrency:
  group: dm-prices
  cancel-in-progress: false
jobs:
  dm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install google-auth requests
      - name: detmir -> таблица (промокод из labels, без Railway)
        env:
          GSHEETS_SA_JSON: ${{ secrets.GSHEETS_SA_JSON }}
          PRICES_SHEET_ID: ${{ secrets.PRICES_SHEET_ID }}
        run: python dm_prices.py
