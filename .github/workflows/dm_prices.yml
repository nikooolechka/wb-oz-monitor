name: Витринные цены Детский Мир
on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 6-7 * * *"    # 09:00-10:59 МСК — ДМ свежий к утреннему скрину (частые тики: GitHub-крон дропает, Яндекс-таймер лежит)
    - cron: "*/20 13-14 * * *"  # 16:00-17:59 МСК — к вечернему скрину
permissions:
  contents: read
concurrency:
  group: dm-prices
  cancel-in-progress: false
jobs:
  dm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install google-auth requests
      - name: detmir -> таблица (промокод из labels, без Railway)
        env:
          GSHEETS_SA_JSON: ${{ secrets.GSHEETS_SA_JSON }}
          PRICES_SHEET_ID: ${{ secrets.PRICES_SHEET_ID }}
        run: python dm_prices.py
