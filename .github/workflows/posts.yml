name: Дайджест постов каналов WB/Ozon

on:
  schedule:
    - cron: "30 6 * * *"   # 09:30 МСК
    - cron: "0 7 * * *"    # 10:00 МСК (резерв на дроп крона)
    - cron: "30 7 * * *"   # 10:30 МСК (резерв)
  workflow_dispatch:
    inputs:
      preview:
        description: "1 = превью (собрать, но НЕ отправлять в канал; вывод в лог)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Прогон дайджеста постов
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          # t.me/s/ заблокирован с облака → читаем каналы через Scrapfly (соц-ключ,
          # фолбэк на основной). Без него посты не соберутся (Failed to resolve t.me).
          SCRAPFLY_KEY_SOCIAL: ${{ secrets.SCRAPFLY_KEY_SOCIAL }}
          SCRAPFLY_KEY: ${{ secrets.SCRAPFLY_KEY }}
          POSTS_PREVIEW: ${{ github.event.inputs.preview || '0' }}
          POSTS_STATE_PATH: data/posts_state.json
        run: python posts_worker.py

      - name: Сохранить состояние
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/ || true
          if git diff --cached --quiet; then
            echo "нет изменений"
          else
            git commit -m "posts state update [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi
