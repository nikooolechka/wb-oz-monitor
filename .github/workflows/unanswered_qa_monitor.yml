name: Неотвеченные вопросы/отзывы ВБ (>36ч → алерт)

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unanswered_qa
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Прогон монитора
        env:
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python unanswered_qa_monitor.py
      - name: Сохранить state
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/unanswered_qa_state.json || true
          if git diff --cached --quiet; then echo "без изменений"; exit 0; fi
          git commit -m "unanswered_qa state [skip ci]"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin main || true
            sleep 5
          done
          exit 1
