name: Монитор габаритов (юнитки → канал изменений)

on:
  schedule:
    - cron: "0 */3 * * *"    # каждые 3 часа — габариты меняются редко, ловит с запасом (было */30, жгло минуты Actions)
  workflow_dispatch:          # кнопка ручного запуска (для мгновенного теста)

# нужно, чтобы воркер мог коммитить снимок состояния обратно
permissions:
  contents: write

concurrency:
  group: gabariti
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Прогон монитора габаритов
        env:
          GSHEETS_SA_JSON: ${{ secrets.GSHEETS_SA_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_PATH: data/gabariti_state.json
        run: python gabariti_monitor.py
      - name: Сохранить снимок обратно в репозиторий
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/gabariti_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "gabariti state update [skip ci]"
            git push
          else
            echo "Снимок не изменился — коммит не нужен."
          fi
