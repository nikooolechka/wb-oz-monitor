name: Ловля новинок (новая номенклатура 1С → канал + чеклист)

on:
  schedule:
    - cron: "0 11 * * *"      # 14:00 МСК ежедневно (после обновления остатков 12-13 МСК)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newcomers
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Прогон ловли новинок
        env:
          GSHEETS_SA_JSON: ${{ secrets.GSHEETS_SA_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEWCOMERS_STATE: data/newcomers_state.json
          NEW_PRODUCTS_PATH: data/gabariti_new_products.json
        run: python newcomers_monitor.py
      - name: Сохранить состояние обратно
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/newcomers_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "newcomers state update [skip ci]"
            git push
          else
            echo "Состояние не изменилось."
          fi
