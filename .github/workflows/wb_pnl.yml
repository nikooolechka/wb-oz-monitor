name: WB P&L
on:
  workflow_dispatch:
    inputs:
      period_from:
        description: "начало периода YYYY-MM-DD"
        default: '2026-06-01'
      period_to:
        description: "конец периода YYYY-MM-DD"
        default: '2026-06-07'
jobs:
  pnl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Считаю P&L WB
        env:
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          PERIOD_FROM: ${{ github.event.inputs.period_from }}
          PERIOD_TO: ${{ github.event.inputs.period_to }}
        run: python wb_report_api.py
      - name: Сохраняю отчёт в репозиторий
        run: |
          git config user.name "wb-pnl-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/reports/ data/wb/ || true
          git commit -m "WB P&L $PERIOD_FROM..$PERIOD_TO" || echo "нет изменений"
          git push
