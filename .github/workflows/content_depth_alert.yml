name: Монитор запаса контента (напоминание готовить след. месяц)

on:
  schedule:
    - cron: "0 6 * * *"      # 09:00 МСК ежедневно
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-depth
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Прогон монитора запаса контента
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CONTENT_DEPTH_STATE: data/content_depth_state.json
        run: python content_depth_alert.py
      - name: Сохранить состояние обратно
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/content_depth_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "content_depth state [skip ci]"
            git push
          else
            echo "состояние не изменилось"
          fi
