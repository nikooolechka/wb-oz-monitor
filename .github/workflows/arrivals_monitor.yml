name: Приходы товара (WB+Ozon, FBS+FBO)

on:
  schedule:
    - cron: "0 5 * * *"    # 08:00 МСК, раз в день
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = только лог, без канала и без записи базы"
        default: ""

permissions:
  contents: write

concurrency:
  group: arrivals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Проверить приходы товара
        env:
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY: ${{ github.event.inputs.dry }}
        run: python arrivals_monitor.py
      - name: Сохранить базу остатков
        run: |
          git config user.name  "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add data/arrivals_state.json || true
          if ! git diff --cached --quiet; then
            git commit -m "arrivals state [skip ci]"; git push
          else
            echo "база не изменилась"
          fi
